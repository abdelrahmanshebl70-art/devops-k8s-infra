apiVersion: apps/v1
kind: Deployment
metadata:
 name: myd2
spec:
 
 replicas: 3
 strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 2
    maxUnavailable: 0
 selector:
   matchLabels:
     env: test
 template:
  metadata:
   labels:
      env: test 

  spec:
   serviceAccountName: myaccount
   tolerations:
     - key: pro 
       value: env
       effect: NoSchedule

   volumes:
     - name: myv2
       configMap:
         name: myconfig2
     

   containers:
    - name: myapp1
      image: abdelrahmanshipl333/image
      ports:
       - containerPort: 80
      resources:
        requests:
          cpu: 250m
          memory: 384Mi
        limits:
          cpu: 500m
          memory: 768Mi

      volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          name: myv2
          subPath: nginx.conf
        

      

      lifecycle:
       preStop:
        exec:
          command: ["sh", "-c", "sleep 30"]
